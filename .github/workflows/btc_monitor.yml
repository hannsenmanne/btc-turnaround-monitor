name: BTC Turnaround Monitor

on:
  schedule:
    - cron: "30 7 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      always_notify:
        description: "Immer Telegram-Nachricht senden (Test)"
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETF_API_KEY: ${{ secrets.ETF_API_KEY }}
          ALWAYS_NOTIFY: ${{ github.event.inputs.always_notify || 'false' }}
        run: python monitor.py
